[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronalyn"
version = "1.0.0rc1"
description = "Policy-enforced AI agent memory orchestration for Hermes Agent using Hindsight, Mnemosyne checkpoints, and durable SQLite delivery."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Chucky"}
]
maintainers = [
  {name = "Chucky"}
]
keywords = [
  "chronalyn",
  "hermes-agent",
  "ai-agent",
  "ai-memory",
  "agent-memory",
  "llm-memory",
  "memory-provider",
  "memory-orchestration",
  "persistent-memory",
  "semantic-memory",
  "durable-memory",
  "hindsight",
  "mnemosyne",
  "checkpointing",
  "python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
mnemosyne = [
  "mnemosyne-memory>=3.15,<4",
]
test = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "pytest>=8.3",
  "pytest-cov>=5",
]
quality = [
  "mypy>=1.11",
  "ruff>=0.8",
  "types-setuptools",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "pytest>=8.3",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.8",
  "types-setuptools",
  "pip-audit>=2.7",
]

[project.scripts]
chronalyn = "chronalyn.cli:main"
# Temporary compatibility alias. Invokes Chronalyn and prints a deprecation
# warning to stderr. Scheduled for removal in a future major release.
hermes-memory-router = "chronalyn.compat_cli:main"

[project.urls]
Homepage = "https://github.com/l1lchucky/hermes-memory-router"
Repository = "https://github.com/l1lchucky/hermes-memory-router"
Issues = "https://github.com/l1lchucky/hermes-memory-router/issues"
Changelog = "https://github.com/l1lchucky/hermes-memory-router/blob/main/CHANGELOG.md"
Documentation = "https://github.com/l1lchucky/hermes-memory-router/blob/main/docs/installation.md"
"Migration Guide" = "https://github.com/l1lchucky/hermes-memory-router/blob/main/docs/migration.md"
Compatibility = "https://github.com/l1lchucky/hermes-memory-router/blob/main/docs/compatibility.md"
"Live Validation" = "https://github.com/l1lchucky/hermes-memory-router/blob/main/docs/live-validation.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chronalyn"]
omit = [
  "src/chronalyn/cli.py",
  "src/chronalyn/factory.py",
  "src/chronalyn/provider.py",
  "src/chronalyn/adapters/mnemosyne.py",
  "src/chronalyn/bootstrap.py",
  "src/chronalyn/setup_tui.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S108"]  # Fixed fake POSIX paths; tests do not write there.
"src/chronalyn/setup_tui.py" = [
  "E501", "F841", "RUF059", "S110", "SIM102", "SIM105", "S603",
] # Interactive curses boundary; formatting remains enforced.

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
packages = ["chronalyn", "hermes_memory_router"]
mypy_path = "src"
warn_unused_ignores = true
