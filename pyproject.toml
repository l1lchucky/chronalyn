[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-router"
version = "0.2.0b1"
description = "A careful Hindsight and Mnemosyne memory policy for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Chucky"}
]
maintainers = [
  {name = "Chucky"}
]
keywords = ["hermes-agent", "memory", "hindsight", "mnemosyne", "agent-memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
mnemosyne = [
  "mnemosyne-memory>=3.15,<4",
]
test = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "pytest>=8.3",
  "pytest-cov>=5",
]
quality = [
  "mypy>=1.11",
  "ruff>=0.8",
  "types-setuptools",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "pytest>=8.3",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.8",
  "types-setuptools",
  "pip-audit>=2.7",
]

[project.scripts]
hermes-memory-router = "hermes_memory_router.cli:main"

[project.urls]
Homepage = "https://github.com/l1lchucky/hermes-memory-router"
Repository = "https://github.com/l1lchucky/hermes-memory-router"
Issues = "https://github.com/l1lchucky/hermes-memory-router/issues"
Changelog = "https://github.com/l1lchucky/hermes-memory-router/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_memory_router = ["resources/*.yaml", "resources/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hermes_memory_router"]
omit = [
  "src/hermes_memory_router/cli.py",
  "src/hermes_memory_router/factory.py",
  "src/hermes_memory_router/provider.py",
  "src/hermes_memory_router/adapters/mnemosyne.py",
  "src/hermes_memory_router/bootstrap.py",
  "src/hermes_memory_router/setup_tui.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S108"]  # Fixed fake POSIX paths; tests do not write there.
"src/hermes_memory_router/setup_tui.py" = [
  "E501", "F841", "RUF059", "S110", "SIM102", "SIM105",
] # Interactive curses boundary; formatting remains enforced.

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
packages = ["hermes_memory_router"]
mypy_path = "src"
warn_unused_ignores = true
