name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Add reviewed bootstrap asset
        run: |
          cp scripts/install-dual.sh dist/install-dual.sh
          chmod 0755 dist/install-dual.sh
      - name: Derive artifact names from the release tag
        shell: bash
        run: |
          # Artifact names derive from the actual release tag (e.g. v1.0.0,
          # v1.1.0-rc.1) instead of a hard-coded version.
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "SBOM_FILE=dist/chronalyn-${GITHUB_REF_NAME}.spdx.json" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
      - name: Generate SHA-256 release manifest
        shell: bash
        run: |
          cd dist
          sha256sum \
            chronalyn-*.whl \
            chronalyn-*.tar.gz \
            install-dual.sh \
            chronalyn-${TAG}.spdx.json \
            > SHA256SUMS-chronalyn-${TAG}.txt
      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
      - name: Upload Python distributions
        # Dedicated artifact containing only the Python distribution files.
        # The PyPI Trusted Publishing job downloads this and nothing else, so
        # install-dual.sh, SBOM, and checksum assets never reach PyPI.
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            dist/chronalyn-*.whl
            dist/chronalyn-*.tar.gz
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: dist/*

  publish-pypi:
    name: Publish Chronalyn to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only the stable tag pattern v<major>.<minor>.<patch> publishes to PyPI.
    # Pre-releases (v1.1.0-rc.1, v1.1.0-alpha.1, ...) keep the GitHub Release
    # flow and never reach PyPI. The explicit tag guard also keeps this job
    # inert for non-tag workflow runs.
    if: startsWith(github.ref, 'refs/tags/') && github.ref_name matches '^v[0-9]+\.[0-9]+\.[0-9]+$'

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
