name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Add reviewed bootstrap asset
        run: |
          cp scripts/install-dual.sh dist/install-dual.sh
          chmod 0755 dist/install-dual.sh
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/chronalyn-v1.0.0-rc.1.spdx.json
      - name: Generate SHA-256 release manifest
        shell: bash
        run: |
          cd dist
          sha256sum \
            chronalyn-*.whl \
            chronalyn-*.tar.gz \
            install-dual.sh \
            chronalyn-v1.0.0-rc.1.spdx.json \
            > SHA256SUMS-chronalyn-v1.0.0-rc.1.txt
      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: dist/*

