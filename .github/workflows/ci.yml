name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,quality]"
      - run: python -m compileall -q src tests __init__.py
      - run: bash -n scripts/install.sh scripts/install-dual.sh scripts/uninstall.sh scripts/live-smoke-test.sh
      - run: python scripts/check-release-tree.py
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Create isolated CI virtualenv
        shell: bash
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
      - run: .venv-ci/bin/python -m pip install -e ".[test]"
      - run: .venv-ci/bin/python -m pytest --cov --cov-report=term-missing
      - run: .venv-ci/bin/python -m build
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/chronalyn-wheel-test
          /tmp/chronalyn-wheel-test/bin/pip install dist/*.whl
          (cd /tmp && /tmp/chronalyn-wheel-test/bin/python -c "import hermes_memory_router, chronalyn; assert hermes_memory_router.provider is chronalyn.provider")
          /tmp/chronalyn-wheel-test/bin/chronalyn --version
          /tmp/chronalyn-wheel-test/bin/chronalyn \
            --hermes-home /tmp/chronalyn-home \
            init --namespace ci-project --environment staging
          /tmp/chronalyn-wheel-test/bin/chronalyn \
            --hermes-home /tmp/chronalyn-home validate
          /tmp/chronalyn-wheel-test/bin/chronalyn \
            --hermes-home /tmp/chronalyn-home install-plugin
          # Hermes discovers user memory providers at $HERMES_HOME/plugins/<id>/.
          test -f /tmp/chronalyn-home/plugins/chronalyn/__init__.py
          test -f /tmp/chronalyn-home/plugins/chronalyn/plugin.yaml
          grep -q 'kind: exclusive' /tmp/chronalyn-home/plugins/chronalyn/plugin.yaml
          grep -q 'register_memory_provider' /tmp/chronalyn-home/plugins/chronalyn/__init__.py
          # The legacy provider id must remain loadable for existing installs.
          test -f /tmp/chronalyn-home/plugins/hermes_memory_router/__init__.py
          # The deprecated command must still work and warn on stderr.
          /tmp/chronalyn-wheel-test/bin/hermes-memory-router \
            --hermes-home /tmp/chronalyn-home validate 2> /tmp/deprecation.txt
          grep -qi 'deprecated' /tmp/deprecation.txt
      - run: .venv-ci/bin/python -m pip check
